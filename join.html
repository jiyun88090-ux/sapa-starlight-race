<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213b"><title>학생 참가 신청 · 별빛레이스</title><link rel="stylesheet" href="./enrollment.css"></head>
<body class="enroll-page student-page"><main class="enrollment-ui"><div class="enroll-brand">✦ 제24회 터누림제 · 창원사파고</div><h1>별빛레이스<br>학생 참가 신청</h1><p class="enroll-muted">내 학번으로 신청하고, 행운의 주인공이 되어보세요!</p>
<section class="enroll-card"><p id="joinStatus" class="enroll-event-status" role="status">접수 상태를 확인하고 있어요…</p><form id="joinForm" class="student-form"><label for="studentId">본인 학번</label><input id="studentId" name="studentId" type="text" inputmode="numeric" autocomplete="off" pattern="[123][1-7](0[1-9]|[1-9][0-9])" maxlength="4" placeholder="예: 1105" required aria-describedby="studentHint"><small id="studentHint" class="enroll-muted">1~3학년 1~7반 · 1105 = 1학년 1반 5번</small><label class="student-consent"><input id="joinConsent" type="checkbox" required><span>참가 명단 확인과 추첨을 위한 학번 수집·이용에 동의합니다. 학번과 신청 시각은 행사 운영에 사용하며 행사 종료 후 운영자가 삭제합니다.</span></label><button id="joinSubmit" class="enroll-primary" type="submit" disabled>참여 신청하기</button></form><div id="joinResult" class="student-result" hidden></div><p id="joinMessage" class="enroll-message" role="alert"></p></section>
<p class="enroll-muted">본인 학번으로 한 번만 신청해 주세요.<br>잘못 입력한 학번은 담당 선생님께 수정 요청해 주세요.</p><noscript>참가 신청을 위해 브라우저의 자바스크립트를 켜주세요.</noscript></main><script type="module" src="./join.js"></script></body></html>
